name: build-plugin-packages

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests, entry.js and packaging
        run: |
          python3 - <<'PY'
          import json, pathlib
          for plugin in ("OpenAI", "Anthropic"):
              root = pathlib.Path("plugins") / plugin
              manifest = json.loads((root / "plugin.json").read_text())
              assert set(manifest.keys()) == {"id", "type", "name", "description", "version"}, manifest.keys()
              assert manifest["type"] == "channel"
              assert (root / "frontend" / "entry.js").is_file(), "missing frontend/entry.js"
              assert not (root / "frontend" / "channel-types.json").exists(), "legacy channel-types.json must be removed"
          PY
      - name: Check packaging entry point
        run: python3 packaging/build-package.py --help

# Release CI receives a matching RevlmCore install for each architecture
# from the Revlm release workflow, then builds native .so files and invokes the
# packaging script with both artifacts. Keeping that hand-off explicit is the
# ABI lock: a plugin package is never built against an arbitrary host version.
